name: Build & Release GearDown Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g., v2.4.0)'
        required: true
        default: 'v2.4.0'
        type: string
      release_title:
        description: 'GitHub Release Title'
        required: false
        default: 'GearDown Release'
        type: string
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as Draft Release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Release Version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $tag = $env:GITHUB_REF_NAME
            } else {
              $tag = "v2.4.0"
            }
          }
          $cleanVer = $tag.TrimStart('v')
          Write-Host "Target Release Tag: $tag (Clean SemVer: $cleanVer)"
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "SEMVER_VERSION=$cleanVer" >> $env:GITHUB_ENV

      - name: Restore NuGet Dependencies
        run: dotnet restore GearDown.csproj --source https://api.nuget.org/v3/index.json

      - name: Publish GearDown (Release)
        run: |
          dotnet publish GearDown.csproj -c Release -r win-x64 --self-contained false -o bin/Release/net8.0-windows/publish

      - name: Install & Locate Inno Setup
        shell: pwsh
        run: |
          # Look for existing Inno Setup installations on Windows runner
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 7\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $iscc = $c; break }
            }
          }

          if (-not $iscc) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
              $iscc = (Get-ChildItem -Path "C:\Program Files*", "C:\ProgramData\chocolatey*" -Filter "iscc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
            }
          }

          Write-Host "Found Inno Setup Compiler: $iscc"
          echo "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Compile Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          $iscc = "$env:ISCC_PATH"
          if (-not $iscc -or -not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $iscc) {
            throw "ISCC compiler could not be located."
          }
          Write-Host "Compiling installer with: $iscc"

          # Create output directory
          if (-not (Test-Path "InstallerOutput")) {
            New-Item -ItemType Directory -Path "InstallerOutput" | Out-Null
          }

          $outFilename = "GearDown_Setup_$($env:RELEASE_TAG)"

          & "$iscc" "/DAppVersion=$($env:SEMVER_VERSION)" "/DOutputBaseFilename=$outFilename" setup.iss

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $zipPath = "InstallerOutput/GearDown_Portable_$($env:RELEASE_TAG).zip"
          Compress-Archive -Path "bin/Release/net8.0-windows/publish/*" -DestinationPath $zipPath -Force
          Write-Host "Created portable archive at: $zipPath"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GearDown-${{ env.RELEASE_TAG }}-Installer
          path: InstallerOutput/*
          retention-days: 14

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ inputs.release_title || format('GearDown {0}', env.RELEASE_TAG) }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            InstallerOutput/*.exe
            InstallerOutput/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
